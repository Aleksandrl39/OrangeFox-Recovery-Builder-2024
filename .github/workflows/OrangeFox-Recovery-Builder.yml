name: OrangeFox - Build

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'OrangeFox Branch'
        required: true
        default: '12.1'
        type: choice
        options:
        - 14.1
        - 12.1
        - 11.0
      DEVICE_TREE:
        description: 'Custom Recovery Tree'
        required: true
        default: 'https://github.com/kinguser981/android_device_xiaomi_marble-OFRP'
      DEVICE_TREE_BRANCH:
        description: 'Custom Recovery Tree Branch'
        required: true
        default: 'fox_12.1'
      DEVICE_PATH:
        description: 'Specify your device path.'
        required: true
        default: 'device/xiaomi/marble'
      DEVICE_NAME:
        description: 'Specify your Device Codename.'
        required: true
        default: 'marble'
      BUILD_TARGET:
        description: 'Specify your Build Target'
        required: true
        default: 'recovery'
        type: choice
        options:
        - boot
        - recovery
        - vendorboot
      LDCHECK:
        description: 'Path of blobs to check' 
        required: true
        default: 'system/bin/qseecomd'
      RECOVERY_TAR:
        description: 'Release recovery.tar For Samsung devices'
        required: false
        default: false
        type: boolean
      RECOVERY_INSTALLER:
        description: 'Include recovery installer zip'
        type: boolean
        required: true
        default: true

jobs:
  build:
    name: Build OFRP by ${{ github.actor }}
    runs-on: ubuntu-latest
    if: github.event.repository.owner.id == github.event.sender.id
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Display Inputs
      run: |
        echo "::group::User Environment Variables"
        echo "Displaying variables/inputs."
        echo "Include Recovery Installer: ${{ github.event.inputs.RECOVERY_INSTALLER }}"
        echo "Release recovery.tar For Samsung devices: ${{ github.event.inputs.RECOVERY_TAR }}"
        echo "::endgroup::"

    - name: Clean-up
      uses: rokibhasansagar/slimhub_actions@main

    - name: Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 24
      
    - name: Build Environment
      run: |
        sudo apt update
        sudo apt -y upgrade
        git clone https://gitlab.com/OrangeFox/misc/scripts
        cd scripts
        sudo bash setup/android_build_env.sh
      
    - name: Set-up Manifest
      if: github.event.inputs.MANIFEST_BRANCH == '11.0' || github.event.inputs.MANIFEST_BRANCH == '12.1' || github.event.inputs.MANIFEST_BRANCH == '14.1'
      run: |
        mkdir -p ${GITHUB_WORKSPACE}/OrangeFox
        cd ${GITHUB_WORKSPACE}/OrangeFox
        git config --global user.name "Samuel Kendall"
        git config --global user.email "kinguser981@gmail.com"
        git clone https://gitlab.com/OrangeFox/sync.git
        cd sync
        ./orangefox_sync.sh --branch ${{ github.event.inputs.MANIFEST_BRANCH }} --path ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}

    - name: Clear Build Cache
      run: |
      cd ${GITHUB_WORKSPACE}/OrangeFox/fox_12.1
      rm -rf out
      rm -rf .repo/projects/device/infinix/Infinix-X663.git
      find . -name "*X663*" -type f | head -10

    - name: Clone Device Tree
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
        git clone ${{ github.event.inputs.DEVICE_TREE }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.DEVICE_PATH }}
        cd ${{ github.event.inputs.DEVICE_PATH }}
        echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV

    - name: Check Manifest Branch
      uses: haya14busa/action-cond@v1
      id: fox_branch
      with:
        cond: ${{ github.event.inputs.MANIFEST_BRANCH == '11.0' || github.event.inputs.MANIFEST_BRANCH == '12.1' }}
        if_true: lunch twrp_${{ github.event.inputs.DEVICE_NAME }}-eng && make clean && mka adbd ${{ github.event.inputs.BUILD_TARGET }}image
        if_false: lunch omni_${{ github.event.inputs.DEVICE_NAME }}-eng && make clean && mka ${{ github.event.inputs.BUILD_TARGET }}image

    - name: Verify Device Tree
      run: |
       cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/${{ github.event.inputs.DEVICE_PATH }}
       echo "=== DEVICE TREE VERIFICATION ==="
       echo "Current directory: $(pwd)"
       echo "Device tree files:"
       ls -la
    
       REQUIRED_FILES=("AndroidProducts.mk" "omni_*.mk" "device.mk" "BoardConfig.mk")
       for file in "${REQUIRED_FILES[@]}"; do
        if ls $file 1> /dev/null 2>&1; then
            echo "✓ Found: $file"
        else
            echo "✗ MISSING: $file"
        fi
        done
    
        if ls omni_*.mk 1> /dev/null 2>&1; then
        OMNIFILE=$(ls omni_*.mk | head -1)
        echo "Content of $OMNIFILE:"
        cat "$OMNIFILE"
        fi
        echo "================================"

    - name: Fix Device Configuration
      run: |
       cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/${{ github.event.inputs.DEVICE_PATH }}
       echo "=== FIXING DEVICE CONFIGURATION ==="

       cat > omni_X663.mk << 'EOF'
       PRODUCT_MAKEFILES := $(LOCAL_DIR)/omni_X663.mk
       $(call inherit-product, device/infinix/Infinix-X663/device.mk)

       PRODUCT_DEVICE := X663
       PRODUCT_NAME := omni_X663
       PRODUCT_BRAND := Infinix
       PRODUCT_MODEL := Infinix X663
       PRODUCT_MANUFACTURER := Infinix

       PRODUCT_PACKAGES += \
       toybox \
       strace \
       mkfs.f2fs \
       mkfs.ntfs

       PRODUCT_COPY_FILES += \
       $(LOCAL_PATH)/recovery/root/etc/twrp.fstab:recovery/root/etc/twrp.fstab

       PRODUCT_DEFAULT_PROPERTY_OVERRIDES += \
       ro.hardware=$(PRODUCT_DEVICE)

       PRODUCT_SYSTEM_PROPERTIES += \
       ro.product.device=$(PRODUCT_DEVICE)
       EOF   
       echo "Device configuration fixed"
       echo "Content of omni_X663.mk:"
       cat omni_X663.mk
       echo "==================================="
      
    - name: Building OrangeFox
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}

         rm -rf out
    
         set +e
         source build/envsetup.sh
         export ALLOW_MISSING_DEPENDENCIES=true
         export LC_ALL=C
         set -e
    
         echo "=== STARTING BUILD ==="
         echo "Device: X663"
         echo "Build target: ${{ github.event.inputs.BUILD_TARGET }}"

         if ! lunch omni_X663-eng; then
         echo "ERROR:lunch failed!"
         echo "Available lunch targets:"
         lunch
         exit 1
         fi
    
         echo "Lunch successful, starting build..."
    
         make clean

         time mka ${{ github.event.inputs.BUILD_TARGET }}image 2>&1 | tee build.log
    
         BUILD_STATUS=${PIPESTATUS[0]}
         if [ $BUILD_STATUS -eq 0 ]; then
         echo "BUILD SUCCESSFUL"
         if [ -d "out/target/product/X663" ]; then
         echo "Build directory created successfully"
         ls -la out/target/product/X663/
         fi
         else
         echo "BUILD FAILED with status:$BUILD_STATUS"
         echo "Last 50 lines of build log:"
         tail -50 build.log
         exit $BUILD_STATUS
         fi

        - name: Check Build Status
          run: |
         cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
         echo "=== BUILD STATUS CHECK ==="

         if [ -d "out" ]; then
        echo "Out directory exists"
        echo "Out directory structure:"
        find out/ -type d -name "*X663*" 2>/dev/null | head -10 || echo "No X663 directories found"
        echo "All out directories:"
        find out/ -maxdepth 3 -type d 2>/dev/null | head -20
        else
        echo "ERROR: No out directory at all - build completely failed"
        fi
    
        if [ -f "build.log" ]; then
        echo "Build log exists, last 100 lines:"
        tail -100 build.log
        else
        echo "No build.log found"
        fi
        echo "=========================="

        - name: Check Error Logs
          run: |
          cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
          echo "=== ERROR LOGS ==="

          find . -name "*.log" -type f | xargs grep -l "error:\|ERROR:\|failed\|FAILED" 2>/dev/null | head -5 | while read logfile; do
        echo "Error found in: $logfile"
        tail -20 "$logfile"
        echo "---"
        done || echo "No error logs found"

        if [ -d "out" ]; then
        echo "Recent log files in out:"
        find out/ -name "*.log" -type f -mmin -60 2>/dev/null | head -5
        fi
        echo "=================="
        
        - name: Set Build Date # Output will be use in Release
          run: |
        echo "BUILD_DATE=$(date +%Y%m%d)" >> $GITHUB_ENV
        DEVICE_TREE_URL="${{ github.event.inputs.DEVICE_TREE }}"
        if [[ "${DEVICE_TREE_URL}" == *.git ]]; then
          DEVICE_TREE_URL="${DEVICE_TREE_URL%.git}"
        fi
        echo "DEVICE_TREE_URL=${DEVICE_TREE_URL}" >> $GITHUB_ENV

    - name: Check if Recovery Exist
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
        if [ ! -d "out/target/product/X663" ]; then
        echo "ERROR: Build directory doesn't exist - build failed"
        exit 1
        fi

        cd out/target/product/X663
        echo "Searching for recovery files..."
        echo "Current directory: $(pwd)"
        echo "Files:"
        ls -la
        if ls OrangeFox*.img 1> /dev/null 2>&1; then
        ORANGEFOX_FILE=$(ls OrangeFox*.img | head -1)
        echo "CHECK_IMG_IS_OK=true" >> $GITHUB_ENV
        echo "FILE_PATH=${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}" >> $GITHUB_ENV
        echo "MD5_IMG=$(md5sum "$ORANGEFOX_FILE" | cut -d ' ' -f 1)" >> $GITHUB_ENV
        echo "ORIGINAL_FILE=$ORANGEFOX_FILE" >> $GITHUB_ENV
        echo "Found: $ORANGEFOX_FILE"
        elif [ -f "recovery.img" ]; then
        echo "CHECK_IMG_IS_OK=true" >> $GITHUB_ENV
        echo "FILE_PATH=${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}" >> $GITHUB_ENV
        echo "MD5_IMG=$(md5sum recovery.img | cut -d ' ' -f 1)" >> $GITHUB_ENV
        echo "ORIGINAL_FILE=recovery.img" >> $GITHUB_ENV
        echo "Found: recovery.img"
        elif [ -f "boot.img" ]; then
        echo "CHECK_IMG_IS_OK=true" >> $GITHUB_ENV
        echo "FILE_PATH=${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}" >> $GITHUB_ENV
        echo "MD5_IMG=$(md5sum boot.img | cut -d ' ' -f 1)" >> $GITHUB_ENV
        echo "ORIGINAL_FILE=boot.img" >> $GITHUB_ENV
        echo "Found: boot.img"
        else
        echo "ERROR: No recovery image files found!"
        echo "Available image files:"
        find . -name "*.img" -type f | head -10
        exit 1
        fi

    - name: Rename the Recovery
      run: |
        cd ${{ env.FILE_PATH }}/
        if [ "${{ github.event.inputs.BUILD_TARGET }}" = "boot" ]; then
        mv OrangeFox*.img boot.img
        echo "RECOVERY_TYPE=boot" >> $GITHUB_ENV
        echo "boot.img file found!"
        elif [ "${{ github.event.inputs.BUILD_TARGET }}" = "recovery" ]; then
        mv OrangeFox*.img recovery.img
        echo "RECOVERY_TYPE=recovery" >> $GITHUB_ENV
        echo "recovery.img file found!"
        elif [ "${{ github.event.inputs.BUILD_TARGET }}" = "vendorboot" ]; then
        mv OrangeFox*.img vendor_boot.img
        echo "RECOVERY_TYPE=vendor_boot" >> $GITHUB_ENV
        echo "vendor_boot.img file found!"
        else
        echo "No Recovery file found!"
        fi
      continue-on-error: true
      
    - name: Include Recovery Installer
      run: |
        if [ ${{ github.event.inputs.RECOVERY_INSTALLER }} = true ]; then
          cd ${{ env.FILE_PATH }}/
          wget https://github.com/kinguser981/recovery-installer/releases/download/11256427880/recovery-installer.zip
          zip -ur recovery-installer.zip ${{ env.RECOVERY_TYPE }}.img
        fi
      continue-on-error: true
        
    - name: Recovery to tar for Samsung devices
      run: |
        if [ ${{ github.event.inputs.RECOVERY_TAR }} = true ]; then
          cd ${{ env.FILE_PATH }}/
          tar -cvf ${{ env.RECOVERY_TYPE }}.tar ${{ env.RECOVERY_TYPE }}.img
        fi
      continue-on-error: true

    - name: Upload to Release
      if: env.CHECK_IMG_IS_OK == 'true'
      uses: softprops/action-gh-release@v1
      with:
        files: |
          ${{ env.FILE_PATH }}/${{ env.RECOVERY_TYPE }}.img
          ${{ env.FILE_PATH }}/${{ env.RECOVERY_TYPE }}.tar
          ${{ env.FILE_PATH }}/recovery-installer.zip
          ${{ env.FILE_PATH }}/OrangeFox*.zip
        name: Unofficial OrangeFox for ${{ github.event.inputs.DEVICE_NAME }} // ${{ env.BUILD_DATE }}
        tag_name: ${{ github.run_id }}
        body: |
          Build: ${{ github.event.inputs.MANIFEST_BRANCH }}
          Device: [Device Tree/Branch](${{ github.event.inputs.DEVICE_TREE }}/tree/${{ github.event.inputs.DEVICE_TREE_BRANCH }})
          Commit: Most recent [commit](${{ github.event.inputs.DEVICE_TREE }}/commit/${{ env.COMMIT_ID }}) during building.
          
    - name: Release ramdisk-recovery
      if: env.CHECK_IMG_IS_OK == 'true'
      uses: softprops/action-gh-release@4634c16e79c963813287e889244c50009e7f0981
      with:
        files: |
          ${{ env.FILE_PATH }}/obj/PACKAGING/vendor_ramdisk_fragments_intermediates/recovery.*
          ${{ env.FILE_PATH }}/ramdisk-recovery.*
        name: Unofficial OrangeFox for ${{ github.event.inputs.DEVICE_NAME }} // ${{ env.BUILD_DATE }}
        tag_name: ${{ github.run_id }}
        body: |
          Target: ${{ env.RECOVERY_TYPE }}.img
          Build: ${{ github.event.inputs.MANIFEST_BRANCH }}
          Device: [Device Tree/Branch](${{ env.DEVICE_TREE_URL }}/tree/${{ inputs.DEVICE_TREE_BRANCH }})
          Commit: Most recent [commit](${{ env.DEVICE_TREE_URL }}/commit/${{ env.COMMIT_ID }}) during building.
          MD5 (img): ${{ env.MD5_IMG }}
          
    - name: Run LDCheck
      run: |
        cd tools
        mv -n libneeds ${{ env.FILE_PATH }}/recovery/root/
        mv -n ldcheck ${{ env.FILE_PATH }}/recovery/root/
        cd ${{ env.FILE_PATH }}/recovery/root/
        python3 ldcheck -p system/lib64:vendor/lib64:system/lib:vendor/lib -d ${{ github.event.inputs.LDCHECK }}
        echo "Done checking missing dependencies. Review, and reconfigure your tree."
      continue-on-error: true
